<!doctype html>
<html lang="en" class="h-full bg-stone-100">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}YouTube Research Canvas{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .markdown-body { color: #292524; font-size: 1rem; line-height: 1.75; }
    .markdown-body > * + * { margin-top: 1rem; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      color: #0c0a09; font-weight: 650; line-height: 1.25; margin-top: 1.75em;
    }
    .markdown-body h1 { font-size: 2rem; }
    .markdown-body h2 { border-bottom: 1px solid #e7e5e4; font-size: 1.5rem; padding-bottom: .5rem; }
    .markdown-body h3 { font-size: 1.2rem; }
    .markdown-body h4 { font-size: 1rem; }
    .markdown-body ul { list-style: disc; padding-left: 1.5rem; }
    .markdown-body ol { list-style: decimal; padding-left: 1.5rem; }
    .markdown-body li + li { margin-top: .35rem; }
    .markdown-body blockquote { border-left: 3px solid #f59e0b; color: #57534e; padding-left: 1rem; }
    .markdown-body code { background: #f5f5f4; border-radius: .3rem; font-size: .9em; padding: .15rem .35rem; }
    .markdown-body pre { background: #1c1917; border-radius: .75rem; color: #fafaf9; overflow-x: auto; padding: 1rem; }
    .markdown-body pre code { background: transparent; padding: 0; }
    .markdown-body a { color: #b45309; text-decoration: underline; }
    .markdown-body table { border-collapse: collapse; display: block; overflow-x: auto; width: 100%; }
    .markdown-body th, .markdown-body td { border: 1px solid #d6d3d1; padding: .5rem .75rem; text-align: left; }
    .markdown-body th { background: #f5f5f4; }
  </style>
</head>
<body class="min-h-full text-stone-900 antialiased">
  <header class="border-b border-stone-200 bg-white/90 backdrop-blur">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 lg:px-8">
      <a href="/dashboard" class="text-sm font-semibold tracking-wide text-stone-900">
        FrameIQ
      </a>
      <nav class="flex items-center gap-2 text-sm font-semibold">
        <a href="/dashboard" class="rounded-lg px-3 py-2 text-stone-600 hover:bg-stone-100 hover:text-stone-950">Dashboard</a>
        <a href="/" class="rounded-lg bg-amber-100 px-3 py-2 text-amber-900 hover:bg-amber-200">New canvas</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
